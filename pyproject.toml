[project]
name = "backstop"
version = "0.1.0"
description = "Bounded revenue-recovery agent: detect revenue at risk, diagnose root cause, execute policy-constrained recovery, and measure money recovered."
requires-python = ">=3.12"
dependencies = [
    "groq>=0.13.0",
    "pydantic>=2.9",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: generates full-size scenarios; skip with -m 'not slow' while iterating",
]

[tool.ruff]
line-length = 100
src = ["src"]
